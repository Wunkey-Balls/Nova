<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Nova</title>
		<link rel="icon" href="uv.png" />
		<link rel="stylesheet" href="app.css" />

		<script src="baremux/index.js"></script>
		<script src="uv/uv.bundle.js"></script>
		<script src="uv/uv.config.js"></script>
	</head>

	<body>
		<!-- ===== Top bar ===== -->
		<header id="topbar">
			<div class="brand"><span class="dot"></span> Nova</div>
			<nav id="tabs">
				<button class="tab active" data-view="home">Home</button>
				<button class="tab" data-view="games">Games</button>
				<button class="tab" data-view="apps">Apps</button>
				<button class="tab" data-view="settings">Settings</button>
			</nav>
			<div class="top-actions">
				<button id="btn-launch" class="primary" title="Open this whole site inside an about:blank tab">
					Open in about:blank
				</button>
				<button id="btn-fs-top" class="ghost hidden" title="Toggle fullscreen">⛶ Fullscreen</button>
			</div>
		</header>

		<!-- ===== Home ===== -->
		<main id="view-home" class="view">
			<section class="hero">
				<h1>Search or enter a URL</h1>
				<form id="search-form">
					<input id="search-input" type="text" autocomplete="off" spellcheck="false"
						placeholder="Search the web or type a site like youtube.com" autofocus />
					<button type="submit" class="primary">Go</button>
				</form>
				<p id="home-error" class="error"></p>
			</section>
			<section>
				<div class="section-head">
					<h2>Shortcuts</h2>
					<button id="btn-add-shortcut" class="ghost small">+ Add</button>
				</div>
				<div id="grid-quick" class="grid"></div>
			</section>
		</main>

		<!-- ===== Games ===== -->
		<main id="view-games" class="view hidden">
			<div class="section-head"><h2>Games</h2></div>
			<input id="games-filter" class="filter" type="text" placeholder="Filter games…" />
			<div id="grid-games" class="grid"></div>
		</main>

		<!-- ===== Apps ===== -->
		<main id="view-apps" class="view hidden">
			<div class="section-head"><h2>Apps</h2></div>
			<div id="grid-apps" class="grid"></div>
		</main>

		<!-- ===== Settings ===== -->
		<main id="view-settings" class="view hidden">
			<div class="section-head"><h2>Settings</h2></div>

			<div class="card">
				<label>Search engine
					<select id="set-engine"></select>
				</label>
			</div>

			<div class="card">
				<label>Tab title
					<input id="set-title" type="text" placeholder="Nova" />
				</label>
				<p class="hint">Changes the title shown on this tab and on the about:blank tab.</p>
			</div>

			<div class="card">
				<label class="row">
					<input id="set-redirect" type="checkbox" />
					After opening about:blank, send this original tab to:
				</label>
				<input id="set-redirect-url" type="text" placeholder="https://www.google.com" />
			</div>

			<div class="card">
				<label>Panic key (instantly jumps to the URL below)
					<div class="row">
						<input id="set-panic-key" type="text" readonly placeholder="Not set" />
						<button id="btn-set-panic" class="ghost small">Set key</button>
						<button id="btn-clear-panic" class="ghost small">Clear</button>
					</div>
				</label>
				<input id="set-panic-url" type="text" placeholder="https://www.google.com" />
			</div>

			<div class="card">
				<button id="btn-reset" class="ghost">Reset proxy &amp; clear saved settings</button>
				<p class="hint">Unregisters the proxy service worker and clears everything saved in this browser for this site.</p>
			</div>
		</main>

		<!-- ===== Browser overlay ===== -->
		<div id="browser" class="hidden">
			<div id="toolbar">
				<button id="b-back" title="Back">◀</button>
				<button id="b-forward" title="Forward">▶</button>
				<button id="b-reload" title="Reload">⟳</button>
				<form id="b-form">
					<input id="b-address" type="text" autocomplete="off" spellcheck="false" />
				</form>
				<button id="b-fs" title="Fullscreen">⛶</button>
				<button id="b-close" title="Close site">✕</button>
			</div>
			<div id="b-status"></div>
			<iframe id="uv-frame" allow="fullscreen; autoplay; clipboard-read; clipboard-write; microphone; camera"
				allowfullscreen></iframe>
		</div>

		<div id="toast"></div>

		<script src="register-sw.js"></script>
		<script src="search.js"></script>
		<script src="data.js"></script>
		<script src="app.js"></script>
	</body>
</html>
