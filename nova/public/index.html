<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Nova</title>
		<link rel="icon" href="/icon.png" />
		<link rel="stylesheet" href="/app.css" />

		<script src="/b/index.js"></script>
		<script src="/x/uv.bundle.js"></script>
		<script src="/x/uv.config.js"></script>
	</head>

	<body>
		<header id="topbar">
			<div class="brand"><span class="dot"></span><span data-t="brand"></span></div>
			<nav id="tabs">
				<button class="tab active" data-view="home" data-t="home"></button>
				<button class="tab" data-view="play" data-t="play"></button>
				<button class="tab" data-view="apps" data-t="apps"></button>
				<button class="tab" data-view="opts" data-t="opts"></button>
			</nav>
			<div class="top-actions">
				<button id="btn-launch" class="primary" data-t="launch" data-tt="launchTitle"></button>
				<button id="btn-fs-top" class="ghost hidden" data-t="full"></button>
			</div>
		</header>

		<main id="view-home" class="view">
			<section class="hero">
				<h1 data-t="h1"></h1>
				<form id="search-form">
					<input id="search-input" type="text" autocomplete="off" spellcheck="false" data-p="ph" autofocus />
					<button type="submit" class="primary" data-t="go"></button>
				</form>
				<p id="home-error" class="error"></p>
			</section>
			<section>
				<div class="section-head">
					<h2 data-t="short"></h2>
					<button id="btn-add-shortcut" class="ghost small" data-t="add"></button>
				</div>
				<div id="grid-quick" class="grid"></div>
			</section>
		</main>

		<main id="view-play" class="view hidden">
			<div class="section-head"><h2 data-t="playh"></h2></div>
			<input id="play-find" class="finder" type="text" data-p="find" />
			<div id="grid-play" class="grid"></div>
		</main>

		<main id="view-apps" class="view hidden">
			<div class="section-head"><h2 data-t="appsh"></h2></div>
			<div id="grid-apps" class="grid"></div>
		</main>

		<main id="view-opts" class="view hidden">
			<div class="section-head"><h2 data-t="opth"></h2></div>

			<div class="card">
				<label><span data-t="o_engine"></span>
					<select id="set-engine"></select>
				</label>
			</div>

			<div class="card">
				<label><span data-t="o_title"></span>
					<input id="set-title" type="text" data-p="o_title_ph" />
				</label>
				<p class="hint" data-t="o_title_hint"></p>
			</div>

			<div class="card">
				<label class="row">
					<input id="set-auto" type="checkbox" />
					<span data-t="o_auto"></span>
				</label>
				<p class="hint" data-t="o_auto_hint"></p>
			</div>

			<div class="card">
				<label class="row">
					<input id="set-redirect" type="checkbox" />
					<span data-t="o_redirect"></span>
				</label>
				<input id="set-redirect-url" type="text" placeholder="https://www.google.com" />
			</div>

			<div class="card">
				<label><span data-t="o_panic"></span>
					<div class="row">
						<input id="set-panic-key" type="text" readonly data-p="o_panic_none" />
						<button id="btn-set-panic" class="ghost small" data-t="o_setkey"></button>
						<button id="btn-clear-panic" class="ghost small" data-t="o_clear"></button>
					</div>
				</label>
				<input id="set-panic-url" type="text" placeholder="https://www.google.com" />
			</div>

			<div class="card">
				<button id="btn-reset" class="ghost" data-t="o_reset"></button>
				<p class="hint" data-t="o_reset_hint"></p>
			</div>
		</main>

		<div id="browser" class="hidden">
			<div id="toolbar">
				<button id="b-back" data-tt="back">◀</button>
				<button id="b-forward" data-tt="forward">▶</button>
				<button id="b-reload" data-tt="reload">⟳</button>
				<form id="b-form">
					<input id="b-address" type="text" autocomplete="off" spellcheck="false" />
				</form>
				<button id="b-fs" data-tt="fsTitle">⛶</button>
				<button id="b-close" data-tt="closeSite">✕</button>
			</div>
			<div id="b-status"></div>
			<iframe id="site-frame" allow="fullscreen; autoplay; clipboard-read; clipboard-write; microphone; camera"
				allowfullscreen></iframe>
		</div>

		<div id="cover" class="hidden"><span data-t="tap"></span></div>
		<div id="toast"></div>

		<script src="/c.js"></script>
		<script src="/register-sw.js"></script>
		<script src="/search.js"></script>
		<script src="/app.js"></script>
	</body>
</html>
