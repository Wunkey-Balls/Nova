<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Not found</title>
		<meta name="robots" content="noindex, nofollow" />
		<link rel="icon" href="/icon.png" />
		<style>
			body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0b0a14; color: #ece9ff; font-family: system-ui, sans-serif; }
		</style>
	</head>
	<body>
		<p id="m">Not found.</p>
		<script src="/x/uv.bundle.js"></script>
		<script src="/x/uv.config.js"></script>
		<script src="/register-sw.js"></script>
		<script>
			// If someone lands on a site link before the worker is installed, install it and retry once.
			if (location.pathname.startsWith(__uv$config.prefix) && !sessionStorage.getItem("retry")) {
				sessionStorage.setItem("retry", "1");
				registerSW().then(() => location.reload()).catch(() => {});
			}
		</script>
	</body>
</html>
